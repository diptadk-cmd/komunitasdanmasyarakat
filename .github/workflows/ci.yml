name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation
      - run: corepack pnpm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-pengujian-jaksanggar
          path: output/test-reports/
          retention-days: 14
